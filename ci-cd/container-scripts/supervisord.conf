[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/irv-supervisord.pid
childlogdir=/run
umask=0077

; No HTTP/XML-RPC control socket is enabled.
[eventlistener:fatal-exit]
command=/usr/bin/python3 /usr/local/lib/irv/fatal-exit.py
events=PROCESS_STATE_FATAL
priority=1
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tunnel]
command=/usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/nonexistent /usr/local/bin/cloudflared tunnel --no-autoupdate --grace-period 10s --metrics 127.0.0.1:2000 --loglevel info run --token-file /run/irv-tunnel/token
user=cloudflared
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:java]
; The existing entrypoint prepares /data as root, then execs Java as user irv.
command=/usr/local/bin/irv-entrypoint java -XX:MaxRAMPercentage=70 -jar /app/irv.jar
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
