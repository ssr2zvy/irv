spring.application.name=irv
server.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.shutdown=graceful

spring.task.scheduling.pool.size=4


# Mandatory authentication and isolation for every profile.
# No legacy database, migrations, static SPA, or sandbox runtime. Signup uses its own explicit invite ledger.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.flyway.enabled=false
spring.web.resources.add-mappings=false
server.forward-headers-strategy=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# Fixed internal health port; public tunnel-facing listener is loopback 8081.
server.port=8080

# Opaque, host-only, secure session cookie; restart/deploy deliberately logs everybody out.
server.servlet.session.cookie.name=__Host-irv
server.servlet.session.cookie.path=/
server.servlet.session.timeout=8h
server.servlet.session.persistent=false
# Keep provider errors/codes/JWTs out of production debug logs.
logging.level.org.springframework.security=ERROR

server.tomcat.max-http-form-post-size=16KB
