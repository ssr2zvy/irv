# Private single-Machine test: embedded database persisted on the Fly volume.
# This profile deliberately does not require DATABASE_URL or PostgreSQL.
spring.datasource.url=jdbc:h2:file:${IRV_DATA_DIR:/data}/db/irv;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
