<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>irv · Sign in</title><link rel="stylesheet" href="/auth/style.css"><script src="/auth/app.js" defer></script></head>
<body data-page="login"><main class="page-shell"><header class="page-header"><h1 id="page-title" tabindex="-1" hidden>Sign in</h1><button id="signup-back" class="icon-action" type="button" aria-label="Back" hidden><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></header>
<div class="page-content">
<section id="signin-section" aria-labelledby="page-title"><div class="menu-list">
<button id="login" class="menu-row" type="button" disabled><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="m11.5 11.5 9 9M16 16l2-2M19 19l2-2"/></svg><span>Sign in</span><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
<button id="open-signup" class="menu-row" type="button" hidden><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M3 21v-2a7 7 0 0 1 12-5M19 14v8M15 18h8"/></svg><span>Create account</span><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
<button id="logout" class="menu-row" type="button" hidden><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Sign out</span><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
</div></section>
<section id="signup-section" aria-labelledby="page-title" hidden><form id="signup-form" class="auth-form"><label>Invite code<input name="invite" required minlength="43" maxlength="128" autocomplete="off"></label>
<label>Username<input name="username" required minlength="3" maxlength="32" pattern="[a-z0-9][a-z0-9_.-]{2,31}" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
<label>Email<input name="email" type="email" required maxlength="200" autocomplete="email"></label>
<div class="field-pair"><label>Given name<input name="givenName" required maxlength="100" autocomplete="given-name"></label><label>Family name<input name="familyName" required maxlength="100" autocomplete="family-name"></label></div><button id="signup" class="primary-action" type="submit">Create account</button></form>
<div id="enrollment-next" class="enrollment-next" hidden><p id="enrollment-message" role="status"></p><a id="enrollment-link" class="primary-action" hidden target="_blank" rel="noopener noreferrer">Set up passkey</a><p class="muted">After setup, return here to sign in.</p></div>
<button id="resume-enrollment" class="text-action" type="button">Resume passkey setup</button></section>
<noscript>JavaScript is required to sign in.</noscript></div></main>
<a class="auth-lock icon-action" href="/auth/diagnostics" aria-label="Authentication status" title="Authentication status"><svg class="icon " aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></a>
<p id="message" class="notice" role="alert" hidden></p></body></html>
