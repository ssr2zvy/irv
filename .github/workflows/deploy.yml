name: Fly deployment

# Deployment tag pushes deploy the app; manual dispatch deploys or stops its Machines.
# The repository Actions secret FLY_API_TOKEN is passed straight into the step's
# environment, where ci-cd/deploy.sh reads it; Actions masks it in the logs and
# nothing ever prints or inspects its value.
on:
  push:
    tags: ['deploy/*']
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or stop the app Machines
        type: choice
        options: [deploy, stop]
        default: stop
        required: true

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/deploy/') && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.action == 'deploy' || inputs.action == 'stop'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify deployment revision belongs to main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy or stop
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
        run: bash ci-cd/deploy.sh "$DEPLOY_ACTION"
