name: test
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IRV_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -r agent/requirements.txt
      - run: bash scripts/build.sh
      - run: python3 scripts/local_smoke.py
      - run: npm test --prefix frontend
      - run: docker build -t irv-app:test .
      - run: docker build -f images/Dockerfile.blank -t irv-blank:local .
      - run: docker build -f images/Dockerfile.java -t irv-java:test .
      - run: docker run --rm --entrypoint python3 irv-java:test -m py_compile /opt/irv/agent.py
