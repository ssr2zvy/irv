# Private first deployment. Access with: flyctl proxy 8080:8080 -a iruvu
app = "iruvu"
primary_region = "iad"
[build]
  dockerfile = "ci-cd/Containerfile"
[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "first-deploy"
  IRV_DATA_DIR = "/data"
  IRV_BLOB_DIR = "/data/blobs"
  IRV_PUBLIC_ORIGIN = "http://localhost:8080"
  IRV_PREVIEW_ORIGIN = "http://localhost:8080"
  # HTTP only on the operator's local Fly proxy; no public HTTP service exists.
  IRV_SECURE_COOKIES = "false"
  IRV_FLY_LOGS = "false"

# External services are not required for this private boot/UI test.
# DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD: later PostgreSQL setup.
# S3_BUCKET / S3_ENDPOINT / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: later Tigris setup.
# FLY_API_TOKEN / FLY_ORG / IRV_BLANK_IMAGE / IRV_JAVA_IMAGE: later sandbox provisioning.
# The deployment token belongs in GitHub Actions/Codespaces, not runtime secrets.

[[mounts]]
  source = "iruvu_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"

# Standalone health check; it does not publish a service to the Internet.
[checks.boot]
  type = "http"
  port = 8080
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/api/health"
