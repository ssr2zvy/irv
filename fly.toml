# One private Machine: supervised Java + cloudflared. No public Fly service.
app = "iruvu"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"
[build]
  dockerfile = "ci-cd/Containerfile"
[env]
  PORT = "8080"
  IRV_DATA_DIR = "/data"
  IRV_BLOB_DIR = "/data/blobs"
  IRV_PUBLIC_ORIGIN = "https://iruvu.space"
  IRV_PREVIEW_ORIGIN = "https://iruvu.space"
  # Browser-facing HTTPS requires secure cookies despite the local HTTP hop.
  IRV_SECURE_COOKIES = "true"
  IRV_FLY_LOGS = "false"
  IRV_PUBLIC_STATUS_ENABLED = "false"
  IRV_TUNNEL_ENABLED = "true"

# Authentication Flow 2: temporary certificate binding, invite-gated signup.
# Required for login: IRV_AUTH_INGRESS_SECRET; account must have the irv_user provider role.
# Signup: IRV_ZITADEL_ENROLLMENT_TOKEN and IRV_AUTH_INVITES_JSON.
# IRV_AUTH_ENROLLMENT_ENABLED is optional; explicit false disables signup.
# Invite ledger uses existing /data volume; no PostgreSQL/Tigris/sandbox runtime.
# See docs/flow2-enrollment.md. Certificate gate defaults ON; invites always required.
# DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD: later PostgreSQL setup.
# S3_BUCKET / S3_ENDPOINT / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: later Tigris setup.
# FLY_API_TOKEN / FLY_ORG / IRV_BLANK_IMAGE / IRV_JAVA_IMAGE: later sandbox provisioning.
# The deployment token belongs in GitHub Actions/Codespaces, not runtime secrets.

[[mounts]]
  source = "iruvu_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"

# TUNNEL_TOKEN is a Fly runtime secret on iruvu, not a build argument.
# No public Fly service. Cloudflare routes to http://127.0.0.1:8081.
[[restart]]
  policy = "always"

# Combined readiness: Java returns 503 if the local tunnel is disconnected.
[checks.boot]
  type = "http"
  port = 8080
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/api/health"
