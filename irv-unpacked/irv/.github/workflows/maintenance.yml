name: daily maintenance
on:
  schedule: [{cron: '23 4 * * *'}]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: {group: maintenance, cancel-in-progress: false}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      IRV_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r agent/requirements.txt
      - run: bash scripts/build.sh
      - run: python3 scripts/check_fly_contract.py
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Build refreshed base and extended image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker build --pull --no-cache -f images/Dockerfile.blank -t "$repo-blank:$tag" .
          docker build --no-cache -f images/Dockerfile.java --build-arg "IRV_BASE=$repo-blank:$tag" -t "$repo-java:$tag" .
          echo "BLANK=$repo-blank:$tag" >> "$GITHUB_ENV"
          echo "JAVA=$repo-java:$tag" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: '${{ env.BLANK }}', format: cyclonedx, output: blank-sbom.json}
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: '${{ env.BLANK }}', severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1'}
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: '${{ env.JAVA }}', severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1'}
      - name: Build control-plane image for vulnerability scan
        run: docker build --pull -t irv-control:scan .
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: irv-control:scan, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1'}
      - name: Push immutable candidates
        run: |
          docker push "$BLANK"
          docker push "$JAVA"
          docker inspect --format '{{index .RepoDigests 0}}' "$BLANK" > blank-digest.txt
          docker inspect --format '{{index .RepoDigests 0}}' "$JAVA" > java-digest.txt
      - name: Stage candidates
        env:
          STAGING_ORIGIN: ${{ secrets.IRV_SMOKE_ORIGIN }}
          MAINTENANCE_TOKEN: ${{ secrets.IRV_STAGING_MAINTENANCE_TOKEN }}
        run: |
          test -n "$STAGING_ORIGIN" && test -n "$MAINTENANCE_TOKEN"
          python3 scripts/promote.py "$STAGING_ORIGIN"
      - name: Live Fly staging lifecycle test
        env:
          IRV_SMOKE_ORIGIN: ${{ secrets.IRV_SMOKE_ORIGIN }}
          IRV_SMOKE_USERNAME: ${{ secrets.IRV_SMOKE_USERNAME }}
          IRV_SMOKE_PASSWORD: ${{ secrets.IRV_SMOKE_PASSWORD }}
          IRV_SMOKE_TOTP: ${{ secrets.IRV_SMOKE_TOTP }}
        run: python3 scripts/live_smoke.py
      - name: Promote passed images to production catalog
        env:
          PRODUCTION_ORIGIN: ${{ secrets.IRV_PRODUCTION_ORIGIN }}
          MAINTENANCE_TOKEN: ${{ secrets.IRV_PRODUCTION_MAINTENANCE_TOKEN }}
        run: |
          test -n "$PRODUCTION_ORIGIN" && test -n "$MAINTENANCE_TOKEN"
          python3 scripts/promote.py "$PRODUCTION_ORIGIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-evidence
          path: |
            build/fly-openapi.json
            *-digest.txt
            *-sbom.json
            backend/target/surefire-reports
