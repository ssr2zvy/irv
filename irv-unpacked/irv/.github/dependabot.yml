version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: {interval: daily}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: daily}
  - package-ecosystem: pip
    directory: /agent
    schedule: {interval: daily}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: daily}
  - package-ecosystem: docker
    directory: /images
    schedule: {interval: daily}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: daily}
