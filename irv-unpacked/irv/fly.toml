# Replace the globally unique app name and set IRV_PUBLIC_ORIGIN accordingly.
app = "replace-with-your-irv-app"
primary_region = "iad"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  IRV_SECURE_COOKIES = "true"
  IRV_WORKING_STORAGE = "ephemeral"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"
